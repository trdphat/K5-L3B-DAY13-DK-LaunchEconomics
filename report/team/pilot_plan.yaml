# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Người phụ trách: Vũ Quang Thanh (Member 3) · Nhóm DK · Lớp L3B
# Kiểm tra đọc được: cd src && python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (z chính xác 1,95996 và 0,84162)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; 3.103 yêu cầu mỗi nhóm
#      = 42 nhân viên mỗi nhóm; cần 84 người > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300: loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm:
#      m ≥ 859 × 0,98 / (20 - 859 × 0,02) = 298,5 → 299 yêu cầu mỗi người;
#      DE = 1 + 298 × 0,02 = 6,96; 20 × 299 = 5.980 yêu cầu mỗi nhóm;
#      power ở mức chênh thật 5 điểm chỉ còn 0,64 (đánh đổi đã chấp nhận)
#
# D2 · Năm câu kiểm tra tách được tác động với cách chia theo nhân viên (20 + 20 cụm)
#   1. Đối chứng chạy cùng thời gian: Có — 20 nhân viên đối chứng làm cùng 3 tuần, cùng depot, cùng loại yêu cầu.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên — bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — chốt trước ngày bắt đầu, xem primary_metric và decision_date.
#   5. Ít nhất 20 cụm mỗi nhóm: Có — đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 20 cụm mỗi nhóm chỉ đủ mẫu cho mức chênh 6 điểm (859 hiệu dụng);
#   không đủ cho 5 điểm (tối đa 1.000 < 1.251), power ở mức 5 điểm còn 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200) toàn mẫu; 3,97% (39/982) trong phạm vi
#   noi_dia + hang_nang [simulated]. Ngưỡng an toàn chọn: chênh +2 điểm so với nhóm đối chứng,
#   kèm trần tuyệt đối 6%; không dùng ngưỡng tuyệt đối 3% vì pilot sẽ dừng ngay tuần đầu.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"      # một vai trò có quyền dừng pilot, không ghi "cả đội"
  scope: "Chỉ yêu cầu noi_dia và hang_nang tại 6 depot của đợt chạy thử: 982/1.200 yêu cầu, 39/982 ca mở lại = 3,97% [simulated]. Loại quoc_te (1,88× so với 12.000 đ) và doi_tac (0,85×, sát ngưỡng và có điều khoản riêng) theo A3 [simulated]."
  assignment:
    unit: "staff"                           # request | staff | depot — chọn staff để tách được tác động
    control_share: 0.5                      # 20 nhân viên can thiệp + 20 nhân viên đối chứng
    randomized: true                        # bốc thăm bằng code, seed ghi trước, phân tầng theo depot
  rollout: [0.10, 0.25, 0.50]               # mỗi bước một tuần: 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                               # hạ từ 5 xuống 6 điểm để đủ mẫu với 20 cụm mỗi nhóm
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                          # cỡ mẫu HIỆU DỤNG mỗi nhóm ở mức chênh 6 điểm
    design_effect: 6.96                     # DE = 1 + (299 - 1) × 0,02
    clusters_per_arm: 20                    # 20 nhân viên mỗi nhóm; 299 yêu cầu/người → 5.980 yêu cầu/nhóm
  identifiability:
    concurrent_control: "Có — 20 nhân viên đối chứng làm cùng 3 tuần, cùng depot và cùng loại yêu cầu, không dùng trợ lý."
    spillover_risk: "Có — nhân viên trong cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id."
    predeclared: "Có — chỉ số chính, ngưỡng, ba luật dừng và ngày quyết định chốt trước ngày bắt đầu; seed bốc thăm ghi trong biên bản."
  stop_rules:
    # Ngưỡng chi phí tuyệt đối = 1,5 × CPS gốc A2 = 1,5 × 4.472 = 6.708 đ/việc [simulated]
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt trần tuyệt đối 6%, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và rà 20 trace mở lại gần nhất KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công vượt 6.708 đ/việc (1,5 lần CPS gốc A2, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được tăng bước rollout và không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý vượt 40% TRONG 1 tuần (đợt chạy thử: 27,12%, 48/177) THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và tạm dừng tăng bước rollout KHÔNG THÌ không được chuyển sang bước rollout tiếp"
  interim_looks: "chỉ kiểm tra chỉ số an toàn ở tuần 1 và tuần 2; không mở chỉ số chính để tránh dừng sớm"
  rollback: "Giám đốc vận hành bấm cờ tắt trên dashboard, hiệu lực trong 30 phút; yêu cầu đang mở chuyển sang luồng nhân viên tự làm qua handoff_to_staff; khách nhận thông báo đang xử lý."
  decision_date: "2027-01-15"                # 3 tuần rollout + 2 tuần đo đủ 299 yêu cầu/người + 1 tuần tổng hợp
  simulated_inputs:
    - "baseline 0,70 và mục tiêu +5 điểm: giả định của đề bài"
    - "phut_xem_lai_simulated và phut_lam_lai_simulated: số phút giả lập đặt lên trace của đợt chạy thử"
    - "tỉ lệ mở lại trong 7 ngày: 4,25% (51/1.200) toàn mẫu và 3,97% (39/982) trong phạm vi noi_dia + hang_nang"
    - "chi phí mỗi việc thành công 4.472 đ (A2), 2.696 đ và 8.221 đ (noi_dia, hang_nang của A3), 6.708 đ là ngưỡng dừng tính từ A2"
